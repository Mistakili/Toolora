kind = "web"
previewPath = "/private/"
title = "Toolora Private — Private Tool Execution"
version = "1.0.0"
id = "artifacts/toolora-private"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/private/" ]
localPort = 24133

[services.development]
run = "pnpm --filter @workspace/toolora-private run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/toolora-private", "run", "build" ]
publicDir = "artifacts/toolora-private/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24133"
BASE_PATH = "/private/"
