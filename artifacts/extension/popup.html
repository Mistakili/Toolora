<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toolora</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0a0f;
      color: #f1f0ff;
      width: 320px;
      min-height: 400px;
    }
    .header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #1e1e2e;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 28px; height: 28px; background: #7c3aed22;
      border-radius: 8px; display: flex; align-items: center;
      justify-content: center; font-size: 14px; border: 1px solid #7c3aed44;
    }
    .logo-text { font-weight: 800; font-size: 15px; color: #f1f0ff; }
    .logo-text span { color: #7c3aed; }
    .search {
      padding: 10px 12px;
      border-bottom: 1px solid #1e1e2e;
    }
    .search input {
      width: 100%; padding: 7px 12px; background: #1a1a2e;
      border: 1px solid #2e2e44; border-radius: 8px; color: #f1f0ff;
      font-size: 13px; outline: none;
    }
    .search input:focus { border-color: #7c3aed; }
    .section-title {
      padding: 8px 12px 4px;
      font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: #6b7280;
    }
    .tools { padding: 4px 8px; max-height: 280px; overflow-y: auto; }
    .tool-btn {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 8px 8px; border-radius: 8px;
      background: transparent; border: none; cursor: pointer;
      color: #f1f0ff; text-align: left; transition: background 0.15s;
      text-decoration: none;
    }
    .tool-btn:hover { background: #1a1a2e; }
    .tool-icon {
      width: 28px; height: 28px; border-radius: 6px;
      background: #7c3aed22; border: 1px solid #7c3aed33;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; flex-shrink: 0;
    }
    .tool-info .name { font-size: 13px; font-weight: 500; }
    .tool-info .cat { font-size: 11px; color: #6b7280; text-transform: capitalize; }
    .footer {
      padding: 10px 16px;
      border-top: 1px solid #1e1e2e;
      font-size: 11px; color: #6b7280;
      text-align: center;
    }
    .footer a { color: #7c3aed; text-decoration: none; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2e2e44; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚙</div>
    <span class="logo-text">Toolora<span>.</span></span>
  </div>
  <div class="search">
    <input type="text" id="search" placeholder="Search tools..." autofocus />
  </div>
  <div id="tools-container"></div>
  <div class="footer">
    <a href="https://toolora.app" target="_blank">Open Toolora.app ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
