openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Toolora API - Free Online Tools Platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tools
    description: Tool analytics and metadata
  - name: Auth
    description: Browser authentication endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /tools/popular:
    get:
      operationId: getPopularTools
      tags: [tools]
      summary: Get popular tools
      description: Returns list of most-used tools with usage counts
      responses:
        "200":
          description: Popular tools list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PopularToolsResponse"
  /tools/{slug}/use:
    post:
      operationId: trackToolUsage
      tags: [tools]
      summary: Track tool usage
      description: Increment usage counter for a tool
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Usage tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackUsageResponse"
  /user/history:
    get:
      operationId: getUserHistory
      tags: [tools]
      summary: Get user tool history
      description: Returns the authenticated user's recent tool usage
      parameters:
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        "200":
          description: User history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserHistoryResponse"
        "401":
          description: Unauthorized
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the returnTo path on success.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — Bearer <sid>.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PopularTool:
      type: object
      properties:
        slug:
          type: string
        usageCount:
          type: integer
      required:
        - slug
        - usageCount
    PopularToolsResponse:
      type: object
      properties:
        tools:
          type: array
          items:
            $ref: "#/components/schemas/PopularTool"
      required:
        - tools
    TrackUsageResponse:
      type: object
      properties:
        success:
          type: boolean
        usageCount:
          type: integer
      required:
        - success
        - usageCount
    HistoryEntry:
      type: object
      properties:
        toolSlug:
          type: string
        usedAt:
          type: string
          format: date-time
      required:
        - toolSlug
        - usedAt
    UserHistoryResponse:
      type: object
      properties:
        history:
          type: array
          items:
            $ref: "#/components/schemas/HistoryEntry"
      required:
        - history
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
