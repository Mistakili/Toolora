openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: ToolBox API - Free Online Tools Platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tools
    description: Tool analytics and metadata
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /tools/popular:
    get:
      operationId: getPopularTools
      tags: [tools]
      summary: Get popular tools
      description: Returns list of most-used tools with usage counts
      responses:
        "200":
          description: Popular tools list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PopularToolsResponse"
  /tools/{slug}/use:
    post:
      operationId: trackToolUsage
      tags: [tools]
      summary: Track tool usage
      description: Increment usage counter for a tool
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Usage tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackUsageResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PopularTool:
      type: object
      properties:
        slug:
          type: string
        usageCount:
          type: integer
      required:
        - slug
        - usageCount
    PopularToolsResponse:
      type: object
      properties:
        tools:
          type: array
          items:
            $ref: "#/components/schemas/PopularTool"
      required:
        - tools
    TrackUsageResponse:
      type: object
      properties:
        success:
          type: boolean
        usageCount:
          type: integer
      required:
        - success
        - usageCount
